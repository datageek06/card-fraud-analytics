version: 2

sources:
  - name: raw
    description: >
      Raw Sparkov/Kaggle fraud transactions, loaded into Postgres by sql/create_raw.sql.
      Everything is text at this point - all typing happens in stg_transactions.
    schema: public
    tables:
      - name: raw_transactions
        description: "One row per card transaction, untyped, exactly as loaded from data.csv."
        columns:
          - name: trans_num
            description: "Transaction id. Rows with a NULL id are dropped in staging."
            tests:
              - unique
