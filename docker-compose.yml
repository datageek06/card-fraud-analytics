services:
  postgres:
    image: postgres:16
    container_name: fraud_db
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: fraud
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
      - ./sql:/sql
    shm_size: 1gb

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata: